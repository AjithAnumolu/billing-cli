[project]
name = "billing-cli"
version = "0.1.0"
description = "AI learning with MUSE"
readme = "README.md"
authors = [
    { name = "Ajith Kumar Anumolu", email = "ajith@primasolv.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.5",
]

[project.scripts]
billing = "billing.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "billing"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
